# Runs the full scan after the NSE close and commits the result, so the Streamlit app always opens
# with fresh data (its own disk is wiped whenever it restarts). Can also be started by hand from the
# Actions tab ("Run workflow").
name: Daily scan

on:
  # GitHub can delay or silently drop scheduled runs when it is busy, so there are backup times.
  # Extra runs are harmless: the commit step skips when the trading day has not changed.
  # Odd minutes avoid the :00/:30 rush when most scheduled jobs start.
  schedule:
    - cron: "43 10 * * 1-5"   # 16:13 IST, Monday to Friday (after NSE closing prices settle)
    - cron: "47 11 * * 1-5"   # 17:17 IST backup
    - cron: "23 14 * * 1-5"   # 19:53 IST backup
    # No morning backup on purpose: a late start could run during market hours, commit a half-day
    # candle, and the evening runs would then skip that date.
  workflow_dispatch:
    inputs:
      force:
        description: "Save even if this trading day is already saved (replaces that day's scan)"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit data/

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanner dependencies
        run: pip install numpy pandas yfinance "tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git@e6f6aaa7de439ac6e454d9b26d2760ded8dc4923"   # not Streamlit or Flask

      - name: Run scan
        env:   # 2-hour bars: TBC_all_stocks_bars.csv first, TradingView for stocks not in it
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: python -m stock_entry.scan_job

      - name: Commit scan results
        env:
          FORCE: ${{ inputs.force }}   # empty on scheduled runs
        run: |
          data_date() { python -c "import json, sys; print(json.load(sys.stdin).get('data_date'))"; }
          new_date=$(data_date < data/scan_latest.json)
          old_date=$(git show HEAD:data/scan_latest.json 2>/dev/null | data_date || echo none)
          message="chore: daily scan for $new_date"
          if [ "$new_date" = "$old_date" ]; then
            if [ "$FORCE" != "true" ]; then
              echo "No new trading day since the last commit ($new_date), e.g. an NSE holiday. Nothing to commit."
              exit 0
            fi
            message="chore: rescan $new_date"
          fi
          if git diff --quiet -- data/; then
            echo "Scan results unchanged. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scan_latest.json data/fundamentals.json
          git commit -m "$message"
          for attempt in 1 2 3; do   # someone may push at the same moment: rebase onto it and try again
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
          exit 1
